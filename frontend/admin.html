<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo - Pedidos</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .topbar {
      background: #1f2937;
      color: white;
      padding: 18px 20px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 24px;
    }

    .topbar p {
      margin: 6px 0 0;
      color: #d1d5db;
      font-size: 14px;
    }

    .page {
      padding: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stat-card .label {
      color: #666;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 26px;
      font-weight: bold;
    }

    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .card-header {
      padding: 18px;
      border-bottom: 1px solid #eee;
    }

    .card-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .card-header p {
      margin: 6px 0 0;
      color: #666;
      font-size: 14px;
    }

    .filters {
      padding: 16px;
      border-bottom: 1px solid #eee;
      display: grid;
      gap: 10px;
    }

    input, select, button {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-warning {
      background: #f59e0b;
      color: white;
    }

    .btn-warning:hover {
      background: #d97706;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    .pedido-lista {
      padding: 14px;
      max-height: 700px;
      overflow-y: auto;
    }

    .pedido-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .pedido-card:hover {
      background: #f9fafb;
      border-color: #aaa;
    }

    .pedido-card.active {
      background: #eff6ff;
      border-color: #2563eb;
    }

    .pedido-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .pedido-id {
      font-size: 17px;
      font-weight: bold;
    }

    .pedido-meta {
      font-size: 14px;
      color: #555;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .status.pendente {
      background: #fef3c7;
      color: #92400e;
    }

    .status.enviado {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status.entregue {
      background: #dcfce7;
      color: #166534;
    }

    .status.cancelado {
      background: #fee2e2;
      color: #b91c1c;
    }

    .status.outro {
      background: #e5e7eb;
      color: #374151;
    }

    .details {
      padding: 18px;
    }

    .empty-state {
      color: #666;
      background: #f9fafb;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }

    .details-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .details-top h2 {
      margin: 0;
      font-size: 26px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-box {
      background: #f9fafb;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 12px;
    }

    .info-box strong {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }

    .info-box span {
      font-size: 14px;
      font-weight: bold;
    }

    .section-title {
      margin: 22px 0 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #eee;
      border-radius: 12px;
    }

    table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f9fafb;
      color: #555;
      font-size: 13px;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }

    .action-card {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 16px;
      background: #fff;
    }

    .action-card h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 17px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      display: none;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    /* RESPONSIVIDADE */
    @media (max-width: 1100px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .details-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .page {
        padding: 14px;
      }

      .topbar {
        padding: 16px;
      }

      .topbar h1 {
        font-size: 20px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .details-grid {
        grid-template-columns: 1fr;
      }

      .actions-grid {
        grid-template-columns: 1fr;
      }

      .details-top h2 {
        font-size: 22px;
      }

      .pedido-lista {
        max-height: none;
      }

      .card-header,
      .filters,
      .details {
        padding: 14px;
      }

      th, td {
        font-size: 13px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Painel Administrativo</h1>
    <p>Controle de pedidos da loja de peças</p>
  </header>

  <main class="page">
    <section class="stats">
      <div class="stat-card">
        <div class="label">Total de pedidos</div>
        <div class="value" id="statTotalPedidos">0</div>
      </div>

      <div class="stat-card">
        <div class="label">Pedidos pendentes</div>
        <div class="value" id="statPendentes">0</div>
      </div>

      <div class="stat-card">
        <div class="label">Pedidos entregues</div>
        <div class="value" id="statEntregues">0</div>
      </div>

      <div class="stat-card">
        <div class="label">Faturamento total</div>
        <div class="value" id="statFaturamento">R$ 0,00</div>
      </div>
    </section>

    <section class="layout">
      <div class="card">
        <div class="card-header">
          <h2>Pedidos</h2>
          <p>Busque e selecione um pedido</p>
        </div>

        <div class="filters">
          <input id="buscaPedido" type="text" placeholder="Buscar por pedido, cliente ou pagamento" />

          <select id="filtroStatus">
            <option value="">Todos os status</option>
            <option value="Pendente">Pendente</option>
            <option value="Enviado">Enviado</option>
            <option value="Entregue">Entregue</option>
            <option value="Cancelado">Cancelado</option>
          </select>

          <button class="btn-secondary" onclick="carregarPedidos()">Atualizar lista</button>
        </div>

        <div id="listaPedidos" class="pedido-lista"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Detalhes do Pedido</h2>
          <p>Visualização e ações do pedido selecionado</p>
        </div>

        <div id="detalhesPedido" class="details">
          <div class="empty-state">
            Selecione um pedido para ver os detalhes.
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const API = "http://localhost:3000/api";

    let pedidos = [];
    let produtos = [];
    let pedidoSelecionado = null;

    function formatarMoeda(valor) {
      return Number(valor || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function formatarData(data) {
      if (!data) return "-";
      return new Date(data).toLocaleString("pt-BR");
    }

    function normalizar(texto) {
      return String(texto || "").toLowerCase().trim();
    }

    function statusClass(status) {
      const s = normalizar(status);
      if (s === "pendente") return "status pendente";
      if (s === "enviado") return "status enviado";
      if (s === "entregue") return "status entregue";
      if (s === "cancelado") return "status cancelado";
      return "status outro";
    }

    function mostrarMensagem(texto, tipo = "success") {
      const box = document.getElementById("mensagemAcao");
      if (!box) return;
      box.className = `message ${tipo}`;
      box.textContent = texto;
      box.style.display = "block";
    }

    async function carregarProdutos() {
      try {
        const res = await fetch(`${API}/produtos`);
        produtos = await res.json();
      } catch (error) {
        console.error("Erro ao carregar produtos:", error);
      }
    }

    function atualizarCards() {
  document.getElementById("statTotalPedidos").textContent = pedidos.length;

  document.getElementById("statPendentes").textContent =
    pedidos.filter(p => normalizar(p.status_pedido) === "pendente").length;

  document.getElementById("statEntregues").textContent =
    pedidos.filter(p => normalizar(p.status_pedido) === "entregue").length;

  // 
  const faturamento = pedidos
    .filter(p => normalizar(p.status_pedido) === "entregue")
    .reduce((total, pedido) => {
      return total + Number(pedido.total_pedido || 0);
    }, 0);

  document.getElementById("statFaturamento").textContent = formatarMoeda(faturamento);
}

    async function carregarPedidos() {
      try {
        const res = await fetch(`${API}/pedidos`);
        pedidos = await res.json();

        atualizarCards();
        renderizarListaPedidos();
      } catch (error) {
        console.error("Erro ao carregar pedidos:", error);
        document.getElementById("listaPedidos").innerHTML = `
          <div class="empty-state">Erro ao carregar pedidos.</div>
        `;
      }
    }

    function renderizarListaPedidos() {
      const lista = document.getElementById("listaPedidos");
      const filtro = document.getElementById("filtroStatus").value;
      const busca = normalizar(document.getElementById("buscaPedido").value);

      let filtrados = [...pedidos];

      if (filtro) {
        filtrados = filtrados.filter(p => p.status_pedido === filtro);
      }

      if (busca) {
        filtrados = filtrados.filter(p =>
          normalizar(p.id_pedido).includes(busca) ||
          normalizar(p.nome_cliente).includes(busca) ||
          normalizar(p.forma_pagamento).includes(busca)
        );
      }

      if (!filtrados.length) {
        lista.innerHTML = `<div class="empty-state">Nenhum pedido encontrado.</div>`;
        return;
      }

      lista.innerHTML = filtrados.map(pedido => `
        <div class="pedido-card ${pedidoSelecionado && Number(pedidoSelecionado.id_pedido) === Number(pedido.id_pedido) ? "active" : ""}" onclick="selecionarPedido(${pedido.id_pedido})">
          <div class="pedido-row">
            <div class="pedido-id">Pedido #${pedido.id_pedido}</div>
            <span class="${statusClass(pedido.status_pedido)}">${pedido.status_pedido || "-"}</span>
          </div>

          <div class="pedido-row">
            <div class="pedido-meta"><strong>Cliente:</strong> ${pedido.nome_cliente || "-"}</div>
          </div>

          <div class="pedido-row">
            <div class="pedido-meta"><strong>Pagamento:</strong> ${pedido.forma_pagamento || "-"}</div>
            <div class="pedido-meta"><strong>Total:</strong> ${formatarMoeda(pedido.total_pedido)}</div>
          </div>
        </div>
      `).join("");
    }

    async function selecionarPedido(id) {
      try {
        const res = await fetch(`${API}/pedidos/${id}`);
        const data = await res.json();

        pedidoSelecionado = data.pedido;
        pedidoSelecionado.itens = data.itens || [];

        renderizarListaPedidos();
        renderizarDetalhes();
      } catch (error) {
        console.error("Erro ao buscar pedido:", error);
      }
    }

    function montarOptionsProdutos() {
      if (!produtos.length) return `<option value="">Nenhum produto disponível</option>`;

      return produtos.map(produto => `
        <option value="${produto.id_produto}">
          ${produto.nome_produto} | Estoque: ${produto.quantidade_estoque} | ${formatarMoeda(produto.preco_produto)}
        </option>
      `).join("");
    }

    function renderizarDetalhes() {
      const container = document.getElementById("detalhesPedido");

      if (!pedidoSelecionado) {
        container.innerHTML = `
          <div class="empty-state">
            Selecione um pedido para ver os detalhes.
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="details-top">
          <div>
            <h2>Pedido #${pedidoSelecionado.id_pedido}</h2>
          </div>
          <div class="${statusClass(pedidoSelecionado.status_pedido)}">${pedidoSelecionado.status_pedido || "-"}</div>
        </div>

        <div class="details-grid">
          <div class="info-box">
            <strong>Cliente</strong>
            <span>${pedidoSelecionado.nome_cliente || "-"}</span>
          </div>

          <div class="info-box">
            <strong>Data</strong>
            <span>${formatarData(pedidoSelecionado.data_pedido)}</span>
          </div>

          <div class="info-box">
            <strong>Pagamento</strong>
            <span>${pedidoSelecionado.forma_pagamento || "-"}</span>
          </div>

          <div class="info-box">
            <strong>Total</strong>
            <span>${formatarMoeda(pedidoSelecionado.total_pedido)}</span>
          </div>
        </div>

        <h3 class="section-title">Itens do pedido</h3>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço unitário</th>
                <th>Subtotal</th>
              </tr>
            </thead>
            <tbody>
              ${
                pedidoSelecionado.itens.length
                  ? pedidoSelecionado.itens.map(item => `
                    <tr>
                      <td>${item.nome_produto}</td>
                      <td>${item.quantidade}</td>
                      <td>${formatarMoeda(item.preco_unitario)}</td>
                      <td>${formatarMoeda(Number(item.preco_unitario) * Number(item.quantidade))}</td>
                    </tr>
                  `).join("")
                  : `<tr><td colspan="4">Esse pedido ainda não tem itens.</td></tr>`
              }
            </tbody>
          </table>
        </div>

        <div class="actions-grid">
          <div class="action-card">
            <h3>Atualizar status</h3>

            <div class="field">
              <label for="novoStatus">Novo status</label>
              <select id="novoStatus">
                <option value="Pendente" ${pedidoSelecionado.status_pedido === "Pendente" ? "selected" : ""}>Pendente</option>
                <option value="Enviado" ${pedidoSelecionado.status_pedido === "Enviado" ? "selected" : ""}>Enviado</option>
                <option value="Entregue" ${pedidoSelecionado.status_pedido === "Entregue" ? "selected" : ""}>Entregue</option>
                <option value="Cancelado" ${pedidoSelecionado.status_pedido === "Cancelado" ? "selected" : ""}>Cancelado</option>
              </select>
            </div>

            <button class="btn-warning" onclick="alterarStatus()">Salvar status</button>
          </div>

          <div class="action-card">
            <h3>Adicionar item</h3>

            <div class="field">
              <label for="produtoSelect">Produto</label>
              <select id="produtoSelect">
                ${montarOptionsProdutos()}
              </select>
            </div>

            <div class="field">
              <label for="quantidadeItem">Quantidade</label>
              <input id="quantidadeItem" type="number" min="1" value="1" />
            </div>

            <button class="btn-primary" onclick="adicionarItem()">Adicionar ao pedido</button>
          </div>
        </div>

        <div style="margin-top: 18px;">
          <button class="btn-danger" onclick="cancelarPedido()">Cancelar pedido</button>
        </div>

        <div id="mensagemAcao" class="message"></div>
      `;
    }

    async function alterarStatus() {
      if (!pedidoSelecionado) return;

      const status = document.getElementById("novoStatus").value;

      try {
        const res = await fetch(`${API}/pedidos/${pedidoSelecionado.id_pedido}/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status })
        });

        const data = await res.json();

        if (!res.ok) {
          mostrarMensagem(data.erro || "Erro ao atualizar status", "error");
          return;
        }

        mostrarMensagem(data.message || "Status atualizado com sucesso", "success");
        await carregarPedidos();
        await selecionarPedido(pedidoSelecionado.id_pedido);
      } catch (error) {
        console.error(error);
        mostrarMensagem("Erro ao atualizar status", "error");
      }
    }

    async function adicionarItem() {
      if (!pedidoSelecionado) return;

      const id_produto = document.getElementById("produtoSelect").value;
      const quantidade = Number(document.getElementById("quantidadeItem").value);

      if (!quantidade || quantidade <= 0) {
        mostrarMensagem("Quantidade inválida", "error");
        return;
      }

      try {
        const res = await fetch(`${API}/pedidos/${pedidoSelecionado.id_pedido}/itens`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id_produto, quantidade })
        });

        const data = await res.json();

        if (!res.ok) {
          mostrarMensagem(data.erro || "Erro ao adicionar item", "error");
          return;
        }

        mostrarMensagem(data.message || "Item adicionado com sucesso", "success");
        await carregarProdutos();
        await carregarPedidos();
        await selecionarPedido(pedidoSelecionado.id_pedido);
      } catch (error) {
        console.error(error);
        mostrarMensagem("Erro ao adicionar item", "error");
      }
    }

    async function cancelarPedido() {
      if (!pedidoSelecionado) return;

      const confirmar = confirm(`Deseja realmente cancelar o pedido #${pedidoSelecionado.id_pedido}?`);
      if (!confirmar) return;

      try {
        const res = await fetch(`${API}/pedidos/${pedidoSelecionado.id_pedido}/cancelar`, {
          method: "PATCH"
        });

        const data = await res.json();

        if (!res.ok) {
          mostrarMensagem(data.erro || "Erro ao cancelar pedido", "error");
          return;
        }

        mostrarMensagem(data.message || "Pedido cancelado com sucesso", "success");
        await carregarProdutos();
        await carregarPedidos();
        await selecionarPedido(pedidoSelecionado.id_pedido);
      } catch (error) {
        console.error(error);
        mostrarMensagem("Erro ao cancelar pedido", "error");
      }
    }

    document.getElementById("filtroStatus").addEventListener("change", renderizarListaPedidos);
    document.getElementById("buscaPedido").addEventListener("input", renderizarListaPedidos);

    carregarProdutos();
    carregarPedidos();
  </script>
</body>
</html>

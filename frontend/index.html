<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Loja de Peças</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-color: #f5f7fb;
    }

    /* 🔥 CONTAINER GERAL */
    .login-container {
      display: flex;
      min-height: 100vh;
    }

    /* 🔥 BANNER */
    .login-banner {
      width: 50%;
      overflow: hidden;
    }

    .login-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 🔐 LADO DO LOGIN */
    .login-area {
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1f2937, #3b82f6);
    }

    .login-card {
      border: none;
      border-radius: 16px;
    }

    .logo-titulo {
      font-weight: 700;
      color: #1f2937;
    }

    /* 📱 RESPONSIVO */
    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }

      .login-banner {
        width: 100%;
        height: 200px;
      }

      .login-area {
        width: 100%;
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <!-- 🔥 BANNER -->
    <div class="login-banner">
      <img src="img/banner1.jpg" alt="Banner Loja de Peças">
    </div>

    <!-- 🔐 LOGIN -->
    <div class="login-area">
      <div class="card login-card shadow-lg p-4" style="width: 100%; max-width: 420px;">
        
        <div class="text-center mb-4">
          <h2 class="logo-titulo">Loja de Peças</h2>
          <p class="text-muted mb-0">Acesse sua conta</p>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" class="form-control" placeholder="Digite seu e-mail">
        </div>

        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <div class="input-group">
            <input type="password" id="senha" class="form-control" placeholder="Digite sua senha">
            <button class="btn btn-outline-secondary" type="button" id="btnMostrarSenha">👁</button>
          </div>
        </div>

        <div id="mensagem" class="mb-3 text-danger fw-semibold"></div>

        <button id="btnLogin" class="btn btn-primary w-100">Entrar</button>

      </div>
    </div>

  </div>

  <script src="js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Loja de Peças</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1f2937, #3b82f6);
      min-height: 100vh;
    }

    .login-card {
      border: none;
      border-radius: 16px;
    }

    .logo-titulo {
      font-weight: 700;
      color: #1f2937;
    }
  </style>
</head>
<body>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card login-card shadow-lg p-4" style="width: 100%; max-width: 420px;">
      <div class="text-center mb-4">
        <h2 class="logo-titulo">Loja de Peças</h2>
        <p class="text-muted mb-0">Acesse sua conta</p>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" class="form-control" placeholder="Digite seu e-mail">
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <div class="input-group">
          <input type="password" id="senha" class="form-control" placeholder="Digite sua senha">
          <button class="btn btn-outline-secondary" type="button" id="btnMostrarSenha">👁</button>
        </div>
      </div>

      <div id="mensagem" class="mb-3 text-danger fw-semibold"></div>

      <button id="btnLogin" class="btn btn-primary w-100">Entrar</button>

      <div class="mt-4 text-center text-muted" style="font-size: 14px;">
        
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>

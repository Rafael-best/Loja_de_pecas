<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Redefinir Senha | Loja de Peças</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="css/recuperar-senha.css"
  >

</head>


<body>


<main class="recovery-page">


  <div class="recovery-grid"></div>


  <div class="recovery-glow glow-one"></div>
  <div class="recovery-glow glow-two"></div>



  <a
    href="index.html"
    class="recovery-brand"
  >

    <span>

      <i class="fa-solid fa-gears"></i>

    </span>

    <div>

      <strong>
        LOJA DE PEÇAS
      </strong>

      <small>
        Auto Parts & Performance
      </small>

    </div>

  </a>



  <section class="recovery-card">


    <div class="recovery-icon">

      <i class="fa-solid fa-lock"></i>

    </div>


    <span class="recovery-label">

      REDEFINIÇÃO DE SENHA

    </span>


    <h1 id="tituloRedefinicao">

      Crie sua nova senha

    </h1>


    <p id="descricaoRedefinicao">

      Escolha uma nova senha com pelo menos 8 caracteres.

    </p>



    <form id="formRedefinicao">


      <div class="form-group">

        <label for="senhaRedefinicao">

          Nova senha

        </label>


        <div class="input-wrapper">

          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            id="senhaRedefinicao"
            placeholder="Digite a nova senha"
            autocomplete="new-password"
            required
          >

        </div>

      </div>


      <div class="form-group">

        <label for="confirmarSenhaRedefinicao">

          Confirmar nova senha

        </label>


        <div class="input-wrapper">

          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            id="confirmarSenhaRedefinicao"
            placeholder="Digite a nova senha novamente"
            autocomplete="new-password"
            required
          >

        </div>

      </div>



      <div
        id="mensagemRedefinicao"
        class="recovery-message"
      ></div>



      <button
        type="submit"
        id="btnRedefinirSenha"
        class="recovery-button"
      >

        <span>
          Salvar nova senha
        </span>

        <i class="fa-solid fa-arrow-right"></i>

      </button>


    </form>



    <a
      href="login.html"
      class="back-login"
    >

      <i class="fa-solid fa-arrow-left"></i>

      Voltar para o login

    </a>


  </section>



  <footer class="recovery-footer">

    <span>

      © 2026 Loja de Peças

    </span>


    <a href="suporte.html">

      Precisa de ajuda?

    </a>

  </footer>


</main>


<script src="js/redefinir-senha.js"></script>

</body>

</html>

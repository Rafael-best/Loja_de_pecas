<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho - Loja de Peças</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f7fb;
    }

    .item-mobile {
      border: 1px solid #dee2e6;
      border-radius: 12px;
      padding: 14px;
      background-color: #fff;
      margin-bottom: 12px;
    }

    .item-mobile h6 {
      margin-bottom: 10px;
      font-weight: 700;
    }

    @media (max-width: 576px) {
      h3 {
        font-size: 1.3rem;
      }

      .btn {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Carrinho</a>
      <div>
        <a href="produtos.html" class="btn btn-outline-light">Voltar aos produtos</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h3 class="mb-4">Itens no carrinho</h3>

        <div id="listaCarrinho"></div>

        <div class="row mt-4">
          <div class="col-12 col-md-4">
            <label for="formaPagamento" class="form-label">Forma de pagamento</label>
            <select id="formaPagamento" class="form-select">
              <option value="">Selecione</option>
              <option value="Pix">Pix</option>
              <option value="Cartão">Cartão</option>
              <option value="Boleto">Boleto</option>
            </select>
          </div>
        </div>

        <h4 class="mt-4" id="totalCarrinho">Total: R$ 0,00</h4>

        <button id="btnFinalizar" class="btn btn-success mt-3 w-100 w-md-auto">Finalizar compra</button>

        <div id="mensagem" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script src="js/carrinho.js"></script>
</body>
</html>

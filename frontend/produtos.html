<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos - Loja de Peças</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/catalog.css">
</head>

<body class="catalog-page">
  <div class="topo-acoes">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <span class="navbar-brand fw-bold">Loja de peças</span>

        <div class="d-flex flex-wrap gap-2 mt-2 mt-lg-0">
          <a href="pedidos.html" class="btn btn-outline-light">Pedidos</a>
          <a href="carrinho.html" class="btn btn-warning" id="btnCarrinho">Carrinho (0)</a>
          <button id="btnSair" class="btn btn-danger">Sair</button>
        </div>
      </div>
    </nav>
  </div>

  <header class="catalog-hero">
    <img src="./img/banner2.jpg" alt="Peças automotivas para manutenção e reparo">
    <div class="catalog-hero__overlay">
      <div class="container">
        <p class="catalog-hero__eyebrow">Catálogo de autopeças</p>
        <h1>Encontre a peça certa para seu veículo</h1>
        <p>Pesquise, compare e adicione produtos ao seu carrinho.</p>
      </div>
    </div>
  </header>

  <main class="container catalog-main">
    <section class="catalog-heading" aria-labelledby="tituloCatalogo">
      <div>
        <h2 id="tituloCatalogo">Produtos disponíveis</h2>
        <p id="resultadoCatalogo" class="catalog-heading__result" aria-live="polite"></p>
      </div>
    </section>

    <section class="ds-toolbar catalog-toolbar" aria-label="Filtros do catálogo">
      <div class="ds-field catalog-toolbar__search">
        <label class="ds-label" for="campoBusca">Pesquisar</label>
        <input type="search" id="campoBusca" class="ds-input" placeholder="Nome, descrição, marca ou código">
      </div>

      <div class="ds-field">
        <label class="ds-label" for="filtroCategoria">Categoria</label>
        <select id="filtroCategoria" class="ds-select">
          <option value="">Todas as categorias</option>
        </select>
      </div>

      <div class="ds-field">
        <label class="ds-label" for="ordenacaoProdutos">Ordenar por</label>
        <select id="ordenacaoProdutos" class="ds-select">
          <option value="nome-asc">Nome: A–Z</option>
          <option value="preco-asc">Menor preço</option>
          <option value="preco-desc">Maior preço</option>
          <option value="estoque-desc">Maior estoque</option>
        </select>
      </div>
    </section>

    <section id="listaProdutos" class="catalog-grid" aria-live="polite" aria-busy="true"></section>

    <nav id="paginacaoCatalogo" class="ds-pagination" aria-label="Paginação do catálogo"></nav>
  </main>

  <div id="toastMensagem" class="toast-mensagem" role="status" aria-live="polite"></div>

  <script src="js/produtos.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos - Loja de Peças</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f5f7fb;
    }

    .top-banner {
      position: relative;
      width: 100%;
      background-color: #111;
    }

    .top-banner img {
      width: 100%;
      height: 280px;
      object-fit: contain;
      display: block;
      background-color: #111;
    }

    .top-banner h1 {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 26px;
      margin: 0;
    }

    .card-produto {
      border: none;
      border-radius: 14px;
      transition: 0.2s;
      height: 100%;
    }

    .card-produto:hover {
      transform: translateY(-4px);
    }

    .preco {
      color: #198754;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .descricao-produto {
      min-height: 48px;
    }

    @media (max-width: 576px) {
      .navbar .btn {
        font-size: 0.85rem;
        padding: 0.375rem 0.5rem;
      }

      h2 {
        font-size: 1.4rem;
      }

      .top-banner img {
        height: 180px;
      }

      .top-banner h1 {
        font-size: 18px;
        left: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Loja de Peças</a>

      <div class="d-flex flex-wrap gap-2 mt-2 mt-lg-0">
        <a href="pedidos.html" class="btn btn-outline-light">Pedidos</a>
        <a href="carrinho.html" class="btn btn-warning">Carrinho</a>
        <button id="btnSair" class="btn btn-danger">Sair</button>
      </div>
    </div>
  </nav>

  <div class="top-banner">
    <img src="./img/banner2.jpg" alt="Banner Produtos">
    <h1> </h1>
  </div>

  <div class="container my-4">
    <div class="mb-4">
      <h2 class="mb-1">Produtos disponíveis</h2>
      <small class="text-muted">Escolha os itens e adicione ao carrinho</small>
    </div>

    <div class="row g-4" id="listaProdutos"></div>
  </div>

  <script src="js/produtos.js"></script>
</body>
</html>
